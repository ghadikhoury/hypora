# Default budgets (spec §6.8, §12). Locked at S4.2 (D-051): each is at least ~1.5x the largest use
# measured in the 2026-11-14/15 live A/B/C runs (docs/notes/readiness.md). Eval cases set their own.
# Note PLAN.md §0.3 trigger 6: a single run must not spend more than $5 without asking.
budgets:
  run:
    max_usd: 2.0
    max_compute_seconds: 3600
    max_llm_tokens: 1000000
    max_trials: 12
    max_steps: 200
    max_wall_clock_seconds: 7200
  job_limits:
    max_wall_seconds: 1800
    max_memory_gb: 4.0
    gpu: false
    cpu_threads: 2

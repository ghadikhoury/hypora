# Model profiles (PLAN.md §1, spec §17), self-imposed rate limits, and the retry policy (S0.5).
#   - dev: Gemini free tier on the dedicated "Hypora" Google project (D-007). Flash-Lite is the
#     smallest tier: dev results on it answer "does the system work", not "how good is Hypora".
#   - eval: NOT decided yet. S2.6 (DECIDE) picks the recorded eval/demo model by the procedure in
#     docs/DECISIONS.md D-007 and pins it here; the placeholders below are not a choice.
#     Changing eval after S2.6 invalidates recorded results.
# Select a profile with HYPORA_MODEL_PROFILE=dev|eval (default: dev).
# Gemini 3 temperature: Google strongly recommends the default 1.0 (lower values may cause looping).
models:
  dev:
    description: Development and plumbing. Gemini 3.5 Flash-Lite (free tier) for every tier.
    tiers:
      lead:   {provider: gemini, model_id: gemini-3.5-flash-lite, temperature: 1.0}
      worker: {provider: gemini, model_id: gemini-3.5-flash-lite, temperature: 1.0}
      cheap:  {provider: gemini, model_id: gemini-3.5-flash-lite, temperature: 1.0}
    fallback:
      # Disabled until S2.6 (D-007): there is no OpenAI funding for development. When enabled it
      # must be `tiers_from: eval` with triggers from [rate_limit, quota, server_error].
      enabled: false
  eval:
    description: Recorded evaluations and the demo. Pinned at S2.6; never falls back.
    tiers:
      lead:   {provider: openai, model_id: placeholder-eval-lead,   temperature: 0.0}
      worker: {provider: openai, model_id: placeholder-eval-worker, temperature: 0.0}
      cheap:  {provider: openai, model_id: placeholder-eval-cheap,  temperature: 0.0}
    fallback:
      enabled: false

  # Published per-model limits. The adapter stays at `headroom` x each limit, waits (never spins)
  # when a minute window is full, and stops with a clear error when the daily cap is reached.
  # null = unknown, not enforced client-side. Limits are per Google project, not per key.
  rate_limits:
    headroom: 0.9
    daily_reset_timezone: America/Los_Angeles   # Gemini RPD resets at midnight Pacific
    limits:
      - provider: gemini
        model_id: gemini-3.5-flash-lite
        rpm: 15
        tpm: 250000
        rpd: 500
        source: Google AI Studio rate-limit page, free tier, read by Ghadi (D-007)
        retrieved_on: 2026-10-24
      - provider: gemini
        model_id: gemini-3.1-flash-lite
        rpm: 15
        tpm: 250000
        rpd: 500
        source: Google AI Studio rate-limit page, free tier, read by Ghadi (D-007)
        retrieved_on: 2026-10-24
      - provider: gemini
        model_id: gemini-3.8-flash
        rpm: 5
        tpm: 250000
        rpd: 20
        source: Google AI Studio rate-limit page, free tier, read by Ghadi (D-007)
        retrieved_on: 2026-10-24
      - provider: gemini
        model_id: gemini-3.6-flash
        rpm: 5
        tpm: 250000
        rpd: 20
        source: Google AI Studio rate-limit page, free tier, read by Ghadi (D-007)
        retrieved_on: 2026-10-24

  # Transient errors (429 rate limit, 5xx, timeouts) are retried with exponential backoff and
  # jitter, at most max_retries times; a daily-quota error is never retried.
  retry:
    max_retries: 3
    base_delay_s: 2.0
    max_delay_s: 60.0
    request_timeout_s: 120.0

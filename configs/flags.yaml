# Feature flags (spec §19.4, §9.5). Every evaluation comparison is a switch here.
# Override one with an env var, e.g. HYPORA_FLAGS__AGENT_MODE=single,
# or per eval config in configs/eval/<name>.yaml.
flags:
  agent_mode: multi            # single | multi                       (F3)
  planning: "on"               # on | off                             (F4)
  retrieval_mode: hybrid       # off | tfidf | bm25 | embedding | hybrid | hybrid_rerank  (F1)
  defenses:                    # each defense individually switchable (F6)
    allowlist: true
    sandbox_network: true
    firewall: true
    approval: true
    injection_filter: true
  durable_mode: "on"           # on | off  (F10); inactive until Later durability (D-028)
  breadth_mode: adaptive       # adaptive | fixed_k; inactive (no adaptive-breadth code)
  parallel_mode: "on"          # on | off
  phase_a_mode: parallel       # parallel = A may justify B/C overlap; research_first = never (§5.4)
  approval_policy: interactive # interactive | auto_within_contract
  # Parallelism limits (spec §9.5); provisional until S4.2 (DECIDE).
  max_research_workers: 4      # inactive legacy name
  max_diagnostic_workers: 4    # inactive legacy name
  max_parallel_trials: 3       # inactive legacy name
  max_c_workers: 2

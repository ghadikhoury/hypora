# Feature flags (spec §19.4, §9.5). Every evaluation comparison is a switch here.
# Override one with an env var, e.g. HYPORA_FLAGS__AGENT_MODE=single,
# or per eval config in configs/eval/<name>.yaml.
flags:
  agent_mode: multi            # single | multi                       (F3)
  planning: "on"               # on | off                             (F4)
  retrieval_mode: hybrid       # off | tfidf | bm25 | embedding | hybrid | hybrid_rerank  (F1)
  defenses:                    # each defense individually switchable (F6)
    allowlist: true
    sandbox_network: true
    firewall: true
    approval: true
    injection_filter: true
  durable_mode: "on"           # on | off  (F10); inactive until Later durability (D-028)
  breadth_mode: adaptive       # adaptive | fixed_k; inactive (no adaptive-breadth code)
  parallel_mode: "on"          # on | off
  phase_a_mode: parallel       # parallel = A may justify B/C overlap; research_first = never (§5.4)
  approval_policy: interactive # interactive | auto_within_contract
  # Parallelism limits (spec §9.5); locked at S4.2 (D-051, docs/notes/readiness.md). No live run
  # has started a C worker yet; max_c_workers keeps the D-042 ceiling.
  max_research_workers: 4      # inactive legacy name
  max_diagnostic_workers: 4    # inactive legacy name
  max_parallel_trials: 3       # inactive legacy name
  max_c_workers: 2
  # Too-good-score investigation (S4.1b, D-046, D-050): off reproduces the earlier behavior.
  leakage_flag: "on"           # on | off
  leakage_check:               # thresholds; calibration in docs/notes/leakage-flag.md
    score_margin: 0.08         # maximized metrics: above high end by more than noise + this
    relative_margin: 0.35      # minimized metrics: below low end by noise + this share of it
    screen_max_rows: 50000     # stratified sample cap of the single-column screen
    screen_folds: 5            # out-of-fold parts for category target rates
    screen_min_excess: 0.10    # a candidate beats chance by at least this
    screen_gap_ratio: 1.5      # and stands this many times above the next column
    max_candidates: 3
    permutation_repeats: 3
    permutation_max_rows: 10000
    confirm_fraction: 0.5      # shuffling removes at least this share of the excess
    dominance_ratio: 2.0       # and drops this many times more than other candidates
    max_confirmed: 2
  # Controller robustness (D-056, docs/notes/controller-robustness.md). Caps sit above the most
  # any successful live run used (B: 12 research tool calls; C: 3 diagnostics per session).
  robustness:
    lead_revision_rounds: 2          # A's report at the methodology review -> C revises (0 = stop)
    evidence_before_exclusion: "on"  # on | off: no user -> exclude a questioned column on evidence only
    finish_reserve_steps: 12         # steps kept for A's final review, the final job and the report
    finish_reserve_seconds: 240      # wall-clock seconds kept the same way
    max_diagnostics_per_session: 8   # run_diagnostic calls per C session (proposal or experiments)
    max_research_tool_calls: 16      # tool calls per B research session

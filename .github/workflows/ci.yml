name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Preserve the required status name. Docs emit this status without running make/pytest.
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # classifier needs PR base/head or the complete push range
          persist-credentials: false
      - name: Determine validation scope
        id: scope
        run: python3 scripts/ci_scope.py
      - name: Documentation-only status
        if: steps.scope.outputs.docs_only == 'true'
        run: echo "Prose-only change; no Python setup, make check, pytest or Docker tests. Secret scanning runs separately."
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Install locked dependencies without development hooks
        if: steps.scope.outputs.docs_only != 'true'
        run: uv sync --locked
      - name: Restore sandbox image
        if: steps.scope.outputs.docs_only != 'true'
        id: sandbox-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/hypora-sandbox-cache
          key: sandbox-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hypora/execution/sandbox/Dockerfile.tabular', 'hypora/execution/sandbox/requirements-tabular.lock', 'hypora/execution/sandbox/.dockerignore', 'hypora/execution/sandbox/image.py') }}
      - name: Load cached sandbox image
        if: steps.scope.outputs.docs_only != 'true' && steps.sandbox-cache.outputs.cache-hit == 'true'
        run: docker load --input /tmp/hypora-sandbox-cache/image.tar
      - name: Prepare exact sandbox image
        if: steps.scope.outputs.docs_only != 'true'
        run: make sandbox-image
      # Save before running untrusted trial code or tests, not in a post-test hook.
      - name: Export sandbox image
        if: steps.scope.outputs.docs_only != 'true' && steps.sandbox-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/hypora-sandbox-cache
          image=$(uv run --locked python -c 'from hypora.execution.sandbox.image import tabular_image_tag; print(tabular_image_tag())')
          docker save --output /tmp/hypora-sandbox-cache/image.tar "$image"
      - name: Save sandbox image
        if: steps.scope.outputs.docs_only != 'true' && steps.sandbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/hypora-sandbox-cache
          key: ${{ steps.sandbox-cache.outputs.cache-primary-key }}
      - name: Full non-live regression suite
        if: steps.scope.outputs.docs_only != 'true'
        run: make check-ci

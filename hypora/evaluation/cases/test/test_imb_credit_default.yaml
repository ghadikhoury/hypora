# Class imbalance: 22.1% of clients defaulted. Nothing planted. No primary metric is given: choosing one is the test.
id: test_imb_credit_default
split: test
request: "Identify which credit-card clients in Taiwan will default on next month's payment, so that the bank can manage its risk. Each prediction is made from the client's credit limit and demographics (columns X1 to X5) and the client's repayment status, bill amounts and payments of the previous six months (X6 to X23), all known when the prediction is made."
constraints:
  target: "Y"
  task_type: binary_classification
dataset:
  snapshot: uci-350-default-of-credit-card-clients
  sha256: "9fd75b7f6108b1b584bb1b257ac3cb858c045fc98dcf7cc71a0fc60e7cd263ca"
family: tabular
permitted_tools:
  - inspect_dataset
  - run_diagnostic
  - write_trial_files
  - submit_experiment
  - get_experiment_status
  - get_experiment_metrics
  - get_experiment_logs
  - search_model_catalog
  - get_model_evidence
  - retrieve_methodology
budget: &budget
  max_usd: 0.6
  max_compute_seconds: 1800
  max_llm_tokens: 2000000
  max_trials: 6
  max_steps: 200
  max_wall_clock_seconds: 3600
approval_policy: auto_within_contract
contract_bounds:
  max_budget: *budget
  max_job_limits:
    max_wall_seconds: 300
    max_memory_gb: 4
    cpu_threads: 2
hidden_split:
  strategy: stratified
  fraction: 0.25
  seed: 20261120
grading:
  # Derived from visible rows only (thresholds.py): constant 0.4378, gradient_boosting 0.6826 (3-fold CV);
  # bar = constant + 0.5 x gap; tolerance = 3 x combined standard error.
  hidden_metric:
    name: f1_macro
    threshold: 0.56
    reported_tolerance: 0.038
traps:
  - kind: class_imbalance
    planted: false
    positive_class: 1
    acceptable_metrics: [roc_auc, pr_auc, f1, f1_macro, balanced_accuracy]
expected_decision_class: train

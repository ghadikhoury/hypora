# Temporal order: 10-minute energy readings over 4.5 months. plantings.py only repairs the timestamp format.
id: test_time_appliances
split: test
request: "Predict the energy used by the appliances of a house in each 10-minute interval for coming periods, from the indoor and outdoor conditions recorded in that interval, so that the household can plan its energy use."
constraints:
  target: "Appliances"
  task_type: regression
  primary_metric: mae
dataset:
  snapshot: uci-374-appliances-energy-prediction
  sha256: "884080c48fb40b941bbd86ffd7f4d7079598d26cf70f5a4133b01a9076f7fa0c"
  planted:
    script: hypora/evaluation/cases/test/plantings.py
    file: test_time_appliances.parquet
    sha256: "d6b2fca5ed4873f444f8201f0e783145b023dcbf9cc7836a20657817b08b2f6d"
family: tabular
permitted_tools:
  - inspect_dataset
  - run_diagnostic
  - write_trial_files
  - submit_experiment
  - get_experiment_status
  - get_experiment_metrics
  - get_experiment_logs
  - search_model_catalog
  - get_model_evidence
  - retrieve_methodology
budget: &budget
  max_usd: 0.6
  max_compute_seconds: 600
  max_llm_tokens: 2000000
  max_trials: 6
  max_steps: 200
  max_wall_clock_seconds: 1800
approval_policy: auto_within_contract
contract_bounds:
  max_budget: *budget
  max_job_limits:
    max_wall_seconds: 300
    max_memory_gb: 4
    cpu_threads: 2
hidden_split:
  strategy: temporal
  fraction: 0.25
  seed: 20261120
  time_key: "date"
grading:
  # Derived from visible rows only (thresholds.py): constant 59.74, linear 60.06 (3-fold CV);
  # bar = constant + 0.5 x gap; tolerance = 3 x combined standard error.
  hidden_metric:
    name: mae
    threshold: 60.9
    reported_tolerance: 28.0
traps:
  - kind: temporal_order
    planted: true
    time_key: date
expected_decision_class: train

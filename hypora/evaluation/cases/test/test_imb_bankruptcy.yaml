# Class imbalance: 3.2% of companies went bankrupt. Nothing planted. No primary metric is given: choosing one is the test.
id: test_imb_bankruptcy
split: test
request: "Identify which Taiwanese companies will go bankrupt, so that lenders can review their exposure. Each prediction is made from the company's financial ratios, which are all available when the prediction is made."
constraints:
  target: "Bankrupt?"
  task_type: binary_classification
dataset:
  snapshot: uci-572-taiwanese-bankruptcy-prediction
  sha256: "8af7a5965e686c2807ee7bf61ee86233ad5da107ad49e70cbfa09a2b5ed5b52e"
family: tabular
permitted_tools:
  - inspect_dataset
  - run_diagnostic
  - write_trial_files
  - submit_experiment
  - get_experiment_status
  - get_experiment_metrics
  - get_experiment_logs
  - search_model_catalog
  - get_model_evidence
  - retrieve_methodology
budget: &budget
  max_usd: 0.6
  max_compute_seconds: 1800
  max_llm_tokens: 2000000
  max_trials: 6
  max_steps: 200
  max_wall_clock_seconds: 1800
approval_policy: auto_within_contract
contract_bounds:
  max_budget: *budget
  max_job_limits:
    max_wall_seconds: 300
    max_memory_gb: 4
    cpu_threads: 2
hidden_split:
  strategy: stratified
  fraction: 0.25
  seed: 20261120
grading:
  # Derived from visible rows only (thresholds.py): constant 0.4918, linear 0.6624 (3-fold CV);
  # bar = constant + 0.5 x gap; tolerance = 3 x combined standard error.
  hidden_metric:
    name: f1_macro
    threshold: 0.57
    reported_tolerance: 0.2
traps:
  - kind: class_imbalance
    planted: false
    positive_class: 1
    acceptable_metrics: [roc_auc, pr_auc, f1, f1_macro, balanced_accuracy]
expected_decision_class: train

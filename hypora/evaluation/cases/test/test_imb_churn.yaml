# Class imbalance: 15.7% of customers churned. Nothing planted. No primary metric is given: choosing one is the test.
id: test_imb_churn
split: test
request: "Identify which customers of an Iranian telecom company will churn, so that the retention team can contact them. Each prediction is made at the end of a customer's first nine months, from the usage, billing and complaint records of those nine months; churn is recorded three months later."
constraints:
  target: "Churn"
  task_type: binary_classification
dataset:
  snapshot: uci-563-iranian-churn
  sha256: "0f9ebdfe49935996cb14e2e9a367b76ca75fad445ba955b5b40b35f30f2b331a"
family: tabular
permitted_tools:
  - inspect_dataset
  - run_diagnostic
  - write_trial_files
  - submit_experiment
  - get_experiment_status
  - get_experiment_metrics
  - get_experiment_logs
  - search_model_catalog
  - get_model_evidence
  - retrieve_methodology
budget: &budget
  max_usd: 0.6
  max_compute_seconds: 1800
  max_llm_tokens: 2000000
  max_trials: 6
  max_steps: 200
  max_wall_clock_seconds: 1800
approval_policy: auto_within_contract
contract_bounds:
  max_budget: *budget
  max_job_limits:
    max_wall_seconds: 300
    max_memory_gb: 4
    cpu_threads: 2
hidden_split:
  strategy: stratified
  fraction: 0.25
  seed: 20261120
grading:
  # Derived from visible rows only (thresholds.py): constant 0.4573, gradient_boosting 0.9141 (3-fold CV);
  # bar = constant + 0.5 x gap; tolerance = 3 x combined standard error.
  hidden_metric:
    name: f1_macro
    threshold: 0.68
    reported_tolerance: 0.068
traps:
  - kind: class_imbalance
    planted: false
    positive_class: 1
    acceptable_metrics: [roc_auc, pr_auc, f1, f1_macro, balanced_accuracy]
expected_decision_class: train

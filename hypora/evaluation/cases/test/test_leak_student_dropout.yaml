# Target leakage, already in the data: second-semester results are recorded after the prediction moment the request states.
id: test_leak_student_dropout
split: test
request: "Predict whether each university student will drop out, still be enrolled, or graduate by the end of the normal course duration, so that advisers can contact students at risk early. Each prediction is made at the end of the student's first semester, from the enrollment record, the student's background and economic context, and first-semester results; nothing recorded after the first semester is available when the prediction is made."
constraints:
  target: "Target"
  task_type: multiclass_classification
  primary_metric: f1_macro
dataset:
  snapshot: uci-697-predict-students-dropout-and-academic-success
  sha256: "a8e007ff6a19cabd9fef905d34833ed4ac26df9512c0bb8ae3585a53b2be364d"
family: tabular
permitted_tools:
  - inspect_dataset
  - run_diagnostic
  - write_trial_files
  - submit_experiment
  - get_experiment_status
  - get_experiment_metrics
  - get_experiment_logs
  - search_model_catalog
  - get_model_evidence
  - retrieve_methodology
budget: &budget
  max_usd: 0.6
  max_compute_seconds: 600
  max_llm_tokens: 2000000
  max_trials: 6
  max_steps: 200
  max_wall_clock_seconds: 1800
approval_policy: auto_within_contract
contract_bounds:
  max_budget: *budget
  max_job_limits:
    max_wall_seconds: 300
    max_memory_gb: 4
    cpu_threads: 2
hidden_split:
  strategy: stratified
  fraction: 0.25
  seed: 20261120
grading:
  # Derived from visible rows only (thresholds.py): constant 0.222, gradient_boosting 0.6543 (3-fold CV);
  # bar = constant + 0.5 x gap; tolerance = 3 x combined standard error.
  hidden_metric:
    name: f1_macro
    threshold: 0.43
    reported_tolerance: 0.087
traps:
  - kind: target_leakage
    planted: false
    columns:
      - Curricular units 2nd sem (credited)
      - Curricular units 2nd sem (enrolled)
      - Curricular units 2nd sem (evaluations)
      - Curricular units 2nd sem (approved)
      - Curricular units 2nd sem (grade)
      - Curricular units 2nd sem (without evaluations)
expected_decision_class: train

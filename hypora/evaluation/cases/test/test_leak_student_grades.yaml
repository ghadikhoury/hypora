# Target leakage, already in the data: the first- and second-period grades are given during the year whose final grade is predicted.
id: test_leak_student_grades
split: test
request: "Predict each secondary-school student's final Portuguese-language grade for the year (0 to 20), so that the school can offer support before the year begins. Each prediction is made at the start of the school year, from the student's demographics, family, study habits, social life and school history; no grade from the current school year is known when the prediction is made."
constraints:
  target: "G3"
  task_type: regression
  primary_metric: mae
dataset:
  snapshot: uci-320-student-performance
  sha256: "5a35f78808ede62be8b6c56022ce65f947f363765f6769bbc94edcb63b9dc1cb"
family: tabular
permitted_tools:
  - inspect_dataset
  - run_diagnostic
  - write_trial_files
  - submit_experiment
  - get_experiment_status
  - get_experiment_metrics
  - get_experiment_logs
  - search_model_catalog
  - get_model_evidence
  - retrieve_methodology
budget: &budget
  max_usd: 0.6
  max_compute_seconds: 600
  max_llm_tokens: 2000000
  max_trials: 6
  max_steps: 200
  max_wall_clock_seconds: 1800
approval_policy: auto_within_contract
contract_bounds:
  max_budget: *budget
  max_job_limits:
    max_wall_seconds: 300
    max_memory_gb: 4
    cpu_threads: 2
hidden_split:
  strategy: random
  fraction: 0.25
  seed: 20261120
grading:
  # Derived from visible rows only (thresholds.py): constant 2.302, linear 2.073 (3-fold CV);
  # bar = constant + 0.5 x gap; tolerance = 3 x combined standard error.
  hidden_metric:
    name: mae
    threshold: 2.19
    reported_tolerance: 0.98
traps:
  - kind: target_leakage
    planted: false
    columns: [G1, G2]
expected_decision_class: train

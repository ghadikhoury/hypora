# Tool failure: the first write_trial_files call fails with a retryable error. Clean data. A run must retry and finish.
id: test_fault_write_magic
split: test
request: "Tell gamma-ray showers from hadron background in images from the MAGIC Cherenkov telescope, from the image parameters of each event, so that astronomers can keep the gamma events."
constraints:
  target: "class"
  task_type: binary_classification
  primary_metric: roc_auc
dataset:
  snapshot: uci-159-magic-gamma-telescope
  sha256: "ff533d620d5b81497b2b66a8fcf0a2016ba5a1f2d2f02db71a5c492eaff65fb3"
family: tabular
permitted_tools:
  - inspect_dataset
  - run_diagnostic
  - write_trial_files
  - submit_experiment
  - get_experiment_status
  - get_experiment_metrics
  - get_experiment_logs
  - search_model_catalog
  - get_model_evidence
  - retrieve_methodology
budget: &budget
  max_usd: 0.6
  max_compute_seconds: 600
  max_llm_tokens: 2000000
  max_trials: 6
  max_steps: 200
  max_wall_clock_seconds: 1800
approval_policy: auto_within_contract
contract_bounds:
  max_budget: *budget
  max_job_limits:
    max_wall_seconds: 300
    max_memory_gb: 4
    cpu_threads: 2
hidden_split:
  strategy: stratified
  fraction: 0.25
  seed: 20261120
grading:
  # Derived from visible rows only (thresholds.py): constant 0.5, gradient_boosting 0.932 (3-fold CV);
  # bar = constant + 0.5 x gap; tolerance = 3 x combined standard error.
  hidden_metric:
    name: roc_auc
    threshold: 0.71
    reported_tolerance: 0.044
injected_faults:
  - kind: tool_error
    tool: write_trial_files
    occurrence: 1
    error_code: TOOL_UNAVAILABLE
    expected: recover
expected_decision_class: train

# Temporal order: hourly gas-sensor responses in an Italian city, 2004-2005. plantings.py reads -200 as missing, builds an ISO timestamp, drops hours with no benzene reading and the other reference-analyzer columns.
id: test_time_air_quality
split: test
request: "Estimate the hourly benzene concentration (C6H6, ug/m3) in an Italian city from the responses of five low-cost metal-oxide gas sensors and the temperature and humidity recorded in the same hour, so that the expensive reference analyzer can be retired. The model will be used for coming periods."
constraints:
  target: "C6H6(GT)"
  task_type: regression
  primary_metric: mae
dataset:
  snapshot: uci-360-air-quality
  sha256: "6c839ad673c7261ca30a2615ce7f2b16f8269f690b133d448b9153aabdd63dc9"
  planted:
    script: hypora/evaluation/cases/test/plantings.py
    file: test_time_air_quality.parquet
    sha256: "f4567189de9489347e7dcaf6c198047377cf0c2ed4cfe34f88db10bc84d272c3"
family: tabular
permitted_tools:
  - inspect_dataset
  - run_diagnostic
  - write_trial_files
  - submit_experiment
  - get_experiment_status
  - get_experiment_metrics
  - get_experiment_logs
  - search_model_catalog
  - get_model_evidence
  - retrieve_methodology
budget: &budget
  max_usd: 0.6
  max_compute_seconds: 600
  max_llm_tokens: 2000000
  max_trials: 6
  max_steps: 200
  max_wall_clock_seconds: 1800
approval_policy: auto_within_contract
contract_bounds:
  max_budget: *budget
  max_job_limits:
    max_wall_seconds: 300
    max_memory_gb: 4
    cpu_threads: 2
hidden_split:
  strategy: temporal
  fraction: 0.25
  seed: 20261120
  time_key: "timestamp"
grading:
  # Derived from visible rows only (thresholds.py): constant 5.616, gradient_boosting 0.09979 (3-fold CV);
  # bar = constant + 0.5 x gap; tolerance = 3 x combined standard error.
  hidden_metric:
    name: mae
    threshold: 2.86
    reported_tolerance: 0.56
traps:
  - kind: temporal_order
    planted: true
    time_key: timestamp
expected_decision_class: train

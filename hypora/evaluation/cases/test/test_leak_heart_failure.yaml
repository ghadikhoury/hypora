# Target leakage, already in the data: the follow-up period ends at death or at the last visit, so its length is known only after the outcome.
id: test_leak_heart_failure
split: test
request: "Estimate the risk that a heart-failure patient dies during the follow-up period, so that clinicians can prioritise care. Each prediction is made at the patient's clinical assessment, from the measurements and history recorded there; anything recorded later, including how long the patient was followed, is not available when the prediction is made."
constraints:
  target: "death_event"
  task_type: binary_classification
  primary_metric: roc_auc
dataset:
  snapshot: uci-519-heart-failure-clinical-records
  sha256: "ce8b6a5d66e637f12c6479192ea2288973427a384f65c338a91e8cff137e3336"
family: tabular
permitted_tools:
  - inspect_dataset
  - run_diagnostic
  - write_trial_files
  - submit_experiment
  - get_experiment_status
  - get_experiment_metrics
  - get_experiment_logs
  - search_model_catalog
  - get_model_evidence
  - retrieve_methodology
budget: &budget
  max_usd: 0.6
  max_compute_seconds: 1800
  max_llm_tokens: 2000000
  max_trials: 6
  max_steps: 200
  max_wall_clock_seconds: 3600
approval_policy: auto_within_contract
contract_bounds:
  max_budget: *budget
  max_job_limits:
    max_wall_seconds: 300
    max_memory_gb: 4
    cpu_threads: 2
hidden_split:
  strategy: stratified
  fraction: 0.25
  seed: 20261120
grading:
  # Derived from visible rows only (thresholds.py): constant 0.5, linear 0.7812 (3-fold CV);
  # bar = constant + 0.5 x gap; tolerance = 3 x combined standard error.
  hidden_metric:
    name: roc_auc
    threshold: 0.64
    reported_tolerance: 0.14
traps:
  - kind: target_leakage
    planted: false
    columns: [time]
expected_decision_class: train

# Class imbalance: 9.2% of survey candidates are pulsars. Nothing planted. No primary metric is given: choosing one is the test.
id: test_imb_htru2
split: test
request: "Identify which radio-signal candidates from the High Time Resolution Universe survey are real pulsars, so that astronomers can prioritise follow-up observations. Each prediction is made from the candidate's integrated-profile and DM-SNR curve statistics, which are all available for every candidate."
constraints:
  target: "class"
  task_type: binary_classification
dataset:
  snapshot: uci-372-htru2
  sha256: "407548ce4137625dacb9494b076749af466934109ae348541a4c98a7fb805743"
family: tabular
permitted_tools:
  - inspect_dataset
  - run_diagnostic
  - write_trial_files
  - submit_experiment
  - get_experiment_status
  - get_experiment_metrics
  - get_experiment_logs
  - search_model_catalog
  - get_model_evidence
  - retrieve_methodology
budget: &budget
  max_usd: 0.6
  max_compute_seconds: 1800
  max_llm_tokens: 2000000
  max_trials: 6
  max_steps: 200
  max_wall_clock_seconds: 1800
approval_policy: auto_within_contract
contract_bounds:
  max_budget: *budget
  max_job_limits:
    max_wall_seconds: 300
    max_memory_gb: 4
    cpu_threads: 2
hidden_split:
  strategy: stratified
  fraction: 0.25
  seed: 20261120
grading:
  # Derived from visible rows only (thresholds.py): constant 0.476, gradient_boosting 0.9368 (3-fold CV);
  # bar = constant + 0.5 x gap; tolerance = 3 x combined standard error.
  hidden_metric:
    name: f1_macro
    threshold: 0.7
    reported_tolerance: 0.047
traps:
  - kind: class_imbalance
    planted: false
    positive_class: 1
    acceptable_metrics: [roc_auc, pr_auc, f1, f1_macro, balanced_accuracy]
expected_decision_class: train

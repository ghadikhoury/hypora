# Target leakage and class imbalance, both already in the data: the five failure-mode flags describe how a failure happened, and 3.4% of operations fail.
id: test_leak_ai4i_failure
split: test
request: "Predict which milling operations will end in a machine failure, so that maintenance can intervene first. Each prediction is made when the operation starts, from the product quality variant and the process readings (air and process temperature, rotational speed, torque and tool wear); whether and how the operation fails is not known then."
constraints:
  target: "Machine failure"
  task_type: binary_classification
dataset:
  snapshot: uci-601-ai4i-2020-predictive-maintenance-dataset
  sha256: "42803c53e0ceb143508690ab4a8ac7a5d38fd33182792b6caf565454ba29cc25"
family: tabular
permitted_tools:
  - inspect_dataset
  - run_diagnostic
  - write_trial_files
  - submit_experiment
  - get_experiment_status
  - get_experiment_metrics
  - get_experiment_logs
  - search_model_catalog
  - get_model_evidence
  - retrieve_methodology
budget: &budget
  max_usd: 0.6
  max_compute_seconds: 600
  max_llm_tokens: 2000000
  max_trials: 6
  max_steps: 200
  max_wall_clock_seconds: 1800
approval_policy: auto_within_contract
contract_bounds:
  max_budget: *budget
  max_job_limits:
    max_wall_seconds: 300
    max_memory_gb: 4
    cpu_threads: 2
hidden_split:
  strategy: stratified
  fraction: 0.25
  seed: 20261120
grading:
  # Derived from visible rows only (thresholds.py): constant 0.4914, gradient_boosting 0.8157 (3-fold CV);
  # bar = constant + 0.5 x gap; tolerance = 3 x combined standard error.
  hidden_metric:
    name: f1_macro
    threshold: 0.65
    reported_tolerance: 0.16
traps:
  - kind: target_leakage
    planted: false
    columns: [TWF, HDF, PWF, OSF, RNF]
  - kind: class_imbalance
    planted: false
    positive_class: 1
    acceptable_metrics: [roc_auc, pr_auc, f1, f1_macro, balanced_accuracy]
expected_decision_class: train

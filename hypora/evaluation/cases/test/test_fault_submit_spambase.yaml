# Tool failure: the first submit_experiment call fails with a retryable error. Clean data. A run must retry and finish.
id: test_fault_submit_spambase
split: test
request: "Identify which e-mails are spam from word, character and capital-letter frequencies, so that a mail server can filter them."
constraints:
  target: "Class"
  task_type: binary_classification
  primary_metric: roc_auc
dataset:
  snapshot: uci-94-spambase
  sha256: "2655486aefca3acda8ee93041c12afe69d5be63977c4a3f4e801f4faee76add1"
family: tabular
permitted_tools:
  - inspect_dataset
  - run_diagnostic
  - write_trial_files
  - submit_experiment
  - get_experiment_status
  - get_experiment_metrics
  - get_experiment_logs
  - search_model_catalog
  - get_model_evidence
  - retrieve_methodology
budget: &budget
  max_usd: 0.6
  max_compute_seconds: 1800
  max_llm_tokens: 2000000
  max_trials: 6
  max_steps: 200
  max_wall_clock_seconds: 3600
approval_policy: auto_within_contract
contract_bounds:
  max_budget: *budget
  max_job_limits:
    max_wall_seconds: 300
    max_memory_gb: 4
    cpu_threads: 2
hidden_split:
  strategy: stratified
  fraction: 0.25
  seed: 20261120
grading:
  # Derived from visible rows only (thresholds.py): constant 0.5, gradient_boosting 0.9858 (3-fold CV);
  # bar = constant + 0.5 x gap; tolerance = 3 x combined standard error.
  hidden_metric:
    name: roc_auc
    threshold: 0.74
    reported_tolerance: 0.049
injected_faults:
  - kind: tool_error
    tool: submit_experiment
    occurrence: 1
    error_code: TOOL_UNAVAILABLE
    expected: recover
expected_decision_class: train

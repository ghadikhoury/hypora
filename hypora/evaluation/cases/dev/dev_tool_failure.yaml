# Tool failure: the first submit_experiment call fails with a retryable error. Clean data. A run must retry and finish.
id: dev_tool_failure
split: dev
request: Predict whether a credit applicant is a good or a bad customer.
constraints:
  target: good_or_bad_customer
  task_type: binary_classification
  primary_metric: roc_auc
dataset:
  snapshot: openml-46918-credit-g
  sha256: "ef789622335b73bbe9f26f06a5557cec6f29118cb88bb58d82ba234e4a1d5270"
family: tabular
permitted_tools:
  - inspect_dataset
  - write_trial_files
  - submit_experiment
  - get_experiment_status
  - get_experiment_metrics
  - get_experiment_logs
budget: &budget
  max_usd: 0.6
  max_compute_seconds: 600
  max_llm_tokens: 2000000
  max_trials: 4
  max_steps: 100
  max_wall_clock_seconds: 1800
approval_policy: auto_within_contract
contract_bounds:
  max_budget: *budget
  max_job_limits:
    max_wall_seconds: 300
    max_memory_gb: 4
    cpu_threads: 2
hidden_split:
  strategy: stratified
  fraction: 0.25
  seed: 20261106
grading:
  hidden_metric:
    name: roc_auc
    threshold: 0.67
    reported_tolerance: 0.11
injected_faults:
  - kind: tool_error
    tool: submit_experiment
    occurrence: 1
    error_code: TOOL_UNAVAILABLE
    expected: recover
expected_decision_class: train

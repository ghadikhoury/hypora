# Clean control: real data, no trap. The fixed baseline must pass.
id: dev_clean_control
split: dev
request: Predict the acute toxicity to fish (LC50) of a chemical from its molecular descriptors.
constraints:
  target: LC50
  task_type: regression
  primary_metric: mae
dataset:
  snapshot: openml-46954-qsar-fish-toxicity
  sha256: "3b6dba16ff93c7edb9d63cf23c44be5ea26e76faedbe0d4db9250284f240d98e"
family: tabular
permitted_tools:
  - inspect_dataset
  - write_trial_files
  - submit_experiment
  - get_experiment_status
  - get_experiment_metrics
  - get_experiment_logs
budget: &budget
  max_usd: 0.6
  max_compute_seconds: 600
  max_llm_tokens: 2000000
  max_trials: 4
  max_steps: 100
  max_wall_clock_seconds: 1800
approval_policy: auto_within_contract
contract_bounds:
  max_budget: *budget
  max_job_limits:
    max_wall_seconds: 300
    max_memory_gb: 4
    cpu_threads: 2
hidden_split:
  strategy: random
  fraction: 0.25
  seed: 20261106
grading:
  hidden_metric:
    name: mae
    threshold: 0.76
    reported_tolerance: 0.15
expected_decision_class: train

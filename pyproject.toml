[project]
name = "hypora"
version = "0.1.0"
description = "Agent-powered autonomous ML engineering platform (CIS 1990 final project)."
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.1",
    "docker==7.2.0",
    "google-genai==2.31.0",
    "openai==3.35.1",
    "pydantic==2.13.5",
    "pydantic-settings[yaml]==2.15.0",
    "sqlalchemy==2.1.6",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.17"
# The repo lives on the Windows drive (/mnt/c) while uv's cache is on the WSL filesystem, where
# hardlinks are impossible; copy explicitly instead of warning on every sync.
link-mode = "copy"

[tool.uv.build-backend]
# The package lives at the repo root (hypora/), not under src/. See docs/DECISIONS.md D-001.
module-name = "hypora"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown is excluded: code blocks in docs/ (e.g. the spec's conceptual interfaces) are prose,
# not code, and must not be reformatted.
extend-exclude = ["web", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["hypora"]

[tool.mypy]
python_version = "3.12"
files = ["hypora", "tests", "scripts"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

# Strict mode for hypora/core/ (PLAN.md §2). `strict` itself is a global-only option, so the
# per-module flags it enables are listed explicitly.
[[tool.mypy.overrides]]
module = ["hypora.core", "hypora.core.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
extra_checks = true

# The Docker SDK (and the requests library it is built on) ship no type information; the sandbox
# wraps them behind typed functions instead of adding a stubs package.
[[tool.mypy.overrides]]
module = ["docker", "docker.*", "requests", "requests.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests", "hypora/storage/tests"]
# Live provider calls never run by default (make test-live opts in; see tests/live/).
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--strict-config", "-m", "not live"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "docker: integration tests requiring Docker and the pinned gitleaks image",
    "live: real LLM provider calls; skipped unless selected (make test-live)",
    "paid: live calls that spend money; run only on explicit request (-m 'live and paid')",
    "sandbox: runs real containers; requires Docker and builds the sandbox image (S1.2)",
]
